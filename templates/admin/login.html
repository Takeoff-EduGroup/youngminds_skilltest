{% extends "base.html" %}
{% block title %}Admin log in{% endblock %}
{% block nav %}<a href="{{ url_for('index') }}">Student portal</a>{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-panel auth-narrow admin-panel">
    <h1>Admin log in</h1>
    <p class="muted">For department staff managing student test results.</p>
    <form method="post" class="form" data-validate novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Admin email</label>
        <input id="email" name="email" type="email" required autofocus>
        <small class="error-text"></small>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" required>
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
        <small class="error-text"></small>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
